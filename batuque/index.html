<!doctype html>
<html lang="pt-BR" data-theme="claro" data-density="confortavel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BATUQUE. — Music Journal</title>
  <meta name="description" content="Batuque: avaliador de músicas que aproxima amantes de música e de variados gêneros musicais.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn hamburger" id="menuBtn" aria-label="Abrir menu"></button>
      <a class="logo" href="#/inicio" aria-label="BATUQUE. — Início">
        <span class="logo__ring" aria-hidden="true"></span>
        <span><span class="logo__name">BATUQUE.</span><span class="logo__sub">Music Journal</span></span>
      </a>
      <div class="search" id="search">
        <label class="search__field">
          <span id="searchIco"></span>
          <span class="sr-only">Buscar</span>
          <input id="searchInput" type="search" placeholder="Busque álbuns, faixas, artistas..." autocomplete="off" aria-controls="searchResults" aria-expanded="false">
          <span class="kbd" aria-hidden="true">/</span>
        </label>
        <div class="search__results" id="searchResults" role="listbox" hidden></div>
      </div>
      <nav class="topnav" aria-label="Atalhos">
        <a href="#/descobrir" data-top="descobrir">Explorar</a>
        <a href="#/biblioteca" data-top="biblioteca" class="is-active">Biblioteca</a>
        <a href="#/playlists" data-top="playlists">Coleções</a>
      </nav>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Alternar tema claro/escuro"></button>
        <button class="icon-btn icon-btn--accent" id="paletteBtn" aria-label="Cor de destaque" aria-haspopup="true" aria-expanded="false"></button>
        <a class="avatar" href="#/perfil" id="topAvatar" aria-label="Perfil">VC</a>
      </div>
      <div class="popover" id="palettePop" hidden></div>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <p class="side-label">Seu espaço</p>
      <nav class="side-nav" id="sideNav"></nav>
      <p class="side-label">Sua coleção</p>
      <nav class="side-nav side-nav--small" id="sideNav2"></nav>
      <div class="side-card">
        <p class="eyebrow" style="font-size:8.5px">Seu arquivo musical</p>
        <h3>O som também conta histórias.</h3>
        <p>Organize descobertas, registre resenhas e acompanhe seu gosto.</p>
        <a class="link" href="#/perfil">Ver meu perfil</a>
      </div>
      <p class="side-foot">BATUQUE. · Conceito de interface</p>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div class="view" id="view"></div>
    </main>

    <footer class="player" id="player" aria-label="Player"></footer>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script defer src="js/data.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/player.js"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/pages/inicio.js"></script>
  <script defer src="js/pages/descobrir.js"></script>
  <script defer src="js/pages/biblioteca.js"></script>
  <script defer src="js/pages/album.js"></script>
  <script defer src="js/pages/perfil.js"></script>
  <script defer src="js/pages/resenhas.js"></script>
  <script defer src="js/pages/playlists.js"></script>
  <script defer src="js/pages/configuracoes.js"></script>
  <script defer src="js/pages/agora-tocando.js"></script>
  <script defer src="js/pages/artistas.js"></script>
  <script defer src="js/pages/estatisticas.js"></script>
  <script defer src="js/router.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
